# =============================================================================
# 環境要因（製品共通、多値選択）
# =============================================================================
environment_factors:

  water:
    name: "水濡れ・浸水"
    description: |
      雨、海水、水こぼし、プール、川、水中等による水分起因の故障。
      結露と判断できる場合は humidity を優先。
    keywords:
      - "水没"
      - "浸水"
      - "雨"
      - "海"
      - "プール"
      - "水こぼし"
      - "水濡れ"
      - "川"
    always_user_caused: true
    description_status: "verified"

  sand_dust:
    name: "砂塵・粉塵"
    description: |
      砂、ホコリ、粉塵、土埃等の侵入による故障。
      海岸・砂漠・建設現場等での使用が典型。
    keywords:
      - "砂"
      - "粉塵"
      - "ホコリ"
      - "土埃"
      - "海岸"
      - "砂浜"
    always_user_caused: false
    description_status: "verified"

  impact:
    name: "落下・衝撃"
    description: |
      落下、ぶつけ、強打等の物理的衝撃による故障。
      外装の破損痕・歪みは判定の根拠になりやすい。
    keywords:
      - "落下"
      - "落とした"
      - "ぶつけた"
      - "衝撃"
      - "打撲"
      - "ぶつけ"
    always_user_caused: true
    description_status: "verified"

  heat:
    name: "高温環境"
    description: |
      炎天下、車内放置、夏場の屋外長時間使用等の高温曝露による故障。
    keywords:
      - "車内"
      - "炎天下"
      - "高温"
      - "夏場"
      - "暑い"
    always_user_caused: false
    description_status: "verified"

  cold:
    name: "低温環境"
    description: |
      雪山、冬山、極寒地等の低温環境での使用による故障。
    keywords:
      - "低温"
      - "雪山"
      - "冬山"
      - "極寒"
      - "寒冷"
      - "雪"
    always_user_caused: false
    description_status: "verified"

  humidity:
    name: "高湿度・結露"
    description: |
      高湿度環境での使用、温度差による結露起因の故障。
      明らかに液体としての水接触の場合は water を優先。
    keywords:
      - "結露"
      - "湿気"
      - "高湿度"
      - "湿った"
    always_user_caused: false
    description_status: "verified"

  none:
    name: "該当なし"
    description: |
      通常使用範囲内、環境要因なし。
      他のいずれの要因にも該当しない場合に選択。
      他の要因と同時選択不可。
    is_special: true
    description_status: "verified"

  unknown:
    name: "不明"
    description: |
      環境要因の有無が判定できない情報量。
      コメントに使用環境への言及が一切ない場合等。
    is_special: true
    description_status: "verified"

# =============================================================================
# ユーザ申告再現(v2 用。要件定義書 R-20)
# =============================================================================
claim_reproduction_statuses:

  reproduced:
    name: "再現"
    description: |
      修理者がその申告について原因・所見・処置を書いている(「再現した」と明記されていなくてもよい)。
      ユーザコメント側の「ご指摘外の現象」も含む。
      ユーザから提出された画像・動画・撮影データなどの証左で、修理者が現象を確認できた場合も含む(現品で再現しなかった場合も)。
    counts_as_confirmed: true

  partial:
    name: "一部再現"
    description: "条件付きで再現、または一部の症状だけ再現した。"
    counts_as_confirmed: true

  not_reproduced:
    name: "再現せず"
    description: |
      確認したが症状を確認できなかった(「異常はございませんでした」等の定型文、二重否定の言い回しを含む)。
      予防交換もこちら。
      「ご指摘の現象は確認できませんでした」と書かれていれば、カメラ内部のエラー履歴や推定での部品交換があってもこちら。
    counts_as_confirmed: false

  not_mentioned:
    name: "記載なし"
    description: "その申告について再現の有無が読み取れない。"
    counts_as_confirmed: false

  out_of_scope:
    name: "対象外"
    description: "「レンズ側で対応」など、別の機器での対応とされ、この製品では扱っていない。"
    counts_as_confirmed: false

  request_only:
    name: "依頼のみ"
    description: "点検・清掃などの依頼で、不具合の訴えがない。"
    counts_as_confirmed: false
