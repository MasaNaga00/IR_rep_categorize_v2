        description: "電池蓋・メディア蓋等の開閉検知スイッチの不具合。蓋を閉めても認識しない、蓋を開けても反応しない等。"
        record_type: "failure"
        responsibility: "manufacturer"
        description_status: "ai_inferred"

      # --- サービス系（検査・清掃・OH・ファームアップ）---
      M042:
        name: "検査"
        description: "お客様依頼またはメーカー判断による検査・点検作業を行った修理データ。"
        record_type: "service"
        responsibility: "user_or_unknown"
        responsibility: "user_or_unknown"
        description_status: "verified"

      M043:
        name: "クリーニング"
        description: "清掃・クリーニング作業を行った修理データ。"
        record_type: "service"
        responsibility: "user_or_unknown"
        responsibility: "user_or_unknown"
        description_status: "verified"

      M044:
        name: "オーバーホール"
        description: "定期メンテナンス・オーバーホール作業を行った修理データ。"
        record_type: "service"
        responsibility: "user_or_unknown"
        responsibility: "user_or_unknown"
        description_status: "verified"

      M045:
        name: "ファームアップ"
        description: "ファームウェアアップデートで対応した修理データ。ユーザが不具合を訴えていても、ファームアップで解消した場合はこのコードに分類する。"
        record_type: "service"
        responsibility: "user_or_unknown"
        responsibility: "user_or_unknown"
        description_status: "verified"

      # --- 接続機器要因 ---
      M047:
        name: "接続機器要因"
        description: "接続したレンズ・アクセサリー等の側に原因があり、本体には異常がないと判断された修理データ。"
        record_type: "failure"
        role: "connected_device"
        responsibility: "user_or_unknown"
        responsibility: "user_or_unknown"
        description_status: "verified"

      M048:
        name: "設定・操作起因"
