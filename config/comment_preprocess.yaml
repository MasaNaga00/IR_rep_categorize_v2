# 修理者コメントの注記の除去(要件定義書 R-64〜R-67。2026-11-08 追加)
#
# 修理者コメントの後ろに、修理と関係のない注記(ファームウエアの更新、シャッター回数、
# バッテリーの劣化など)が、決まったマークの後に書かれることがある。
# LLM がこれを故障と読まないよう、Dify に渡す前に取り除く。
#
# 取り除く範囲: マークから「次のマーク・次の丸数字(①〜⑳)・コメントの終わり」のうち最初に来るところの手前まで。
# 取り除いた文は repairs.csv の repair_comment_notes 列に残る。
#
# ■ Windows 側での調整(このファイルをローカル作業フォルダにコピーして直す)
#   - マークは "◾" のように \u + 16進4桁 で書く(文字そのものを書くと、文字コードの違いで化けることがある)。
#   - 実データのマークの文字コードは、Excel で調べられる。例: マークが A2 の15文字目なら
#       =UNICODE(MID(A2,15,1))   → 10進数(例: 9632)
#       =DEC2HEX(UNICODE(MID(A2,15,1)))   → 16進数(例: 25A0)→ "■" と書く
#   - 絵文字の後ろの見えない文字(U+FE0F など)は自動で無視するので、書かなくてよい。
#   - 直したら dry-run を実行し、要約の「注記を取り除いた修理」の件数と、実行フォルダの removed_notes.csv
#     (取り除いた文と、取り除いた後の文の一覧。Excel で開ける)を見て、意図どおり取れているか確かめる。

note_markers:
  - "◾"   # ◾ 黒い中くらいの小さい四角(Mac で ◾️ と見えるもの)
  - "⭐"   # ⭐ 星(Mac で ⭐️ と見えるもの)
  - "※"   # ※ 米印
  - "■"   # ■ 黒い四角(Windows・Shift-JIS で使われやすい)
  - "★"   # ★ 黒い星(同上)

apply_to:
  repair_comment: true    # 修理者コメント(既定: 取り除く)
  user_comment: false     # ユーザコメント(既定: 取り除かない)
